<!DOCTYPE html>
<html>
<head>
    <title>CoC Bot - Multi-Base Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            max-width: 540px;
            margin: 0 auto;
            padding: 15px;
            font-family: 'Rubik', sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(125, 125, 125, 0.2);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-brand img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
        }
        .header-title {
            font-size: 1.3em;
            font-weight: 700;
            margin: 0;
            text-align: left;
        }
        .header-subtitle {
            font-size: 0.75em;
            opacity: 0.65;
            margin: 0;
            text-align: left;
        }
        .global-buttons {
            display: flex;
            gap: 6px;
        }
        .btn-sm-global {
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn-sm-global:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }
        .btn-start-all {
            background-color: #28a745;
            color: #fff;
        }
        .btn-stop-all {
            background-color: #dc3545;
            color: #fff;
        }

        /* Tabs Navigation */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px 8px;
            background: rgba(125, 125, 125, 0.12);
            border: 1px solid rgba(125, 125, 125, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            font-size: 0.88em;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
        }
        .tab-btn:hover {
            background: rgba(125, 125, 125, 0.22);
        }
        .tab-btn.active {
            background: #f1c40f;
            color: #111;
            border-color: #d4ac0d;
            box-shadow: 0 2px 8px rgba(241, 196, 15, 0.35);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-running {
            background-color: #2ecc71;
            box-shadow: 0 0 6px #2ecc71;
        }
        .dot-idle {
            background-color: #95a5a6;
        }

        /* Active Base Control Card */
        .control-card {
            background: rgba(125, 125, 125, 0.08);
            border: 1px solid rgba(125, 125, 125, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .card-left {
            text-align: left;
        }
        .card-instance-name {
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .card-port-tag {
            font-size: 0.78em;
            opacity: 0.7;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-toggle-run {
            padding: 7px 16px;
            font-size: 0.9em;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            min-width: 85px;
            transition: transform 0.15s ease;
        }
        .btn-toggle-run:hover {
            transform: scale(1.03);
        }
        .btn-state-start {
            background-color: #28a745;
            color: #fff;
        }
        .btn-state-stop {
            background-color: #dc3545;
            color: #fff;
        }
        .btn-icon-action {
            background: rgba(125, 125, 125, 0.2);
            color: var(--text);
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon-action:hover {
            background: rgba(125, 125, 125, 0.35);
        }

        /* Terminal Console Box */
        .terminal-wrapper {
            background: #121417;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            text-align: left;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .terminal-header {
            background: #1c2024;
            padding: 6px 12px;
            font-size: 0.78em;
            font-weight: 600;
            color: #8b949e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .terminal-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .terminal-body {
            height: 380px;
            overflow-y: auto;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
            font-size: 0.78em;
            line-height: 1.45;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .log-info { color: #58a6ff; }
        .log-attack { color: #f1c40f; }
        .log-success { color: #3fb950; }
        .log-warn { color: #d29922; }
        .log-err { color: #f85149; }
    </style>
</head>
<body>
    <!-- Top Header & Global Actions -->
    <div class="header-bar">
        <div class="header-brand">
            <img src="{{ url_for('static', filename='coc_bot_logo.png') }}" alt="CoC Bot">
            <div>
                <div class="header-title">CoC Bot Manager</div>
                <div class="header-subtitle">Multi-Base Attack Controller</div>
            </div>
        </div>
        <div class="global-buttons">
            <button class="btn-sm-global btn-start-all" onclick="startAll()"><i class="fas fa-play"></i> Start All</button>
            <button class="btn-sm-global btn-stop-all" onclick="stopAll()"><i class="fas fa-stop"></i> Stop All</button>
        </div>
    </div>

    <!-- Instance Tabs -->
    <div class="tabs-container">
        {% for inst in instances %}
        <button class="tab-btn {{ 'active' if loop.first else '' }}" id="tab_{{ inst.id }}" onclick="switchTab('{{ inst.id }}')">
            <span class="status-dot {{ 'dot-running' if inst.running else 'dot-idle' }}" id="dot_{{ inst.id }}"></span>
            {{ inst.id }}
        </button>
        {% endfor %}
    </div>

    <!-- Active Base Controls -->
    {% for inst in instances %}
    <div class="control-card-wrapper" id="panel_{{ inst.id }}" style="{{ '' if loop.first else 'display:none;' }}">
        <div class="control-card">
            <div class="card-left">
                <div class="card-instance-name">
                    {{ inst.id }}
                    <span id="badge_{{ inst.id }}" style="font-size:0.7em; padding: 2px 7px; border-radius: 6px; font-weight:700; background:{{ '#28a745' if inst.running else '#6c757d' }}; color:white;">
                        {{ 'RUNNING' if inst.running else 'IDLE' }}
                    </span>
                </div>
                <div class="card-port-tag"><i class="fas fa-network-wired"></i> ADB Port: {{ inst.port }}</div>
            </div>
            <div class="card-actions">
                <button 
                    id="btn_run_{{ inst.id }}" 
                    class="btn-toggle-run {{ 'btn-state-stop' if inst.running else 'btn-state-start' }}" 
                    onclick="toggleInstance('{{ inst.id }}')">
                    {{ 'STOP' if inst.running else 'START' }}
                </button>
                <a href="/instances/{{ inst.id }}" class="btn-icon-action" title="Settings & Timer">
                    <i class="fas fa-cog"></i>
                </a>
                <button class="btn-icon-action" onclick="clearLogs('{{ inst.id }}')" title="Clear Logs">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
    {% endfor %}

    <!-- In-App Live Terminal Console -->
    <div class="terminal-wrapper">
        <div class="terminal-header">
            <div class="terminal-title">
                <i class="fas fa-terminal"></i> <span id="current_log_title">main</span> - Live Console Output
            </div>
            <div>
                <span id="auto_scroll_status" style="opacity:0.7;"><i class="fas fa-arrow-down"></i> Auto-Scroll</span>
            </div>
        </div>
        <div class="terminal-body" id="log_terminal">Loading logs...</div>
    </div>

    <script>
        const allInstances = {{ instances|tojson }};
        let currentTab = allInstances.length > 0 ? allInstances[0].id : "main";
        const instanceStates = {};

        allInstances.forEach(inst => {
            instanceStates[inst.id] = { running: inst.running, port: inst.port };
        });

        function switchTab(id) {
            currentTab = id;
            allInstances.forEach(inst => {
                const tab = document.getElementById(`tab_${inst.id}`);
                const panel = document.getElementById(`panel_${inst.id}`);
                if (inst.id === id) {
                    tab.classList.add('active');
                    panel.style.display = 'block';
                } else {
                    tab.classList.remove('active');
                    panel.style.display = 'none';
                }
            });
            document.getElementById('current_log_title').textContent = id;
            fetchLogs();
        }

        async function toggleInstance(id) {
            const btn = document.getElementById(`btn_run_${id}`);
            const isRunning = btn.classList.contains('btn-state-stop');
            const action = isRunning ? 'stop' : 'start';

            btn.disabled = true;
            try {
                const res = await fetch('/instance_action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action, id: id })
                });
                const result = await res.json();
                if (result === 1) {
                    const running = (action === 'start');
                    instanceStates[id].running = running;
                    updateInstanceUI(id, running);
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }

        function updateInstanceUI(id, isRunning) {
            const btn = document.getElementById(`btn_run_${id}`);
            const badge = document.getElementById(`badge_${id}`);
            const dot = document.getElementById(`dot_${id}`);

            if (btn) {
                btn.className = `btn-toggle-run ${isRunning ? 'btn-state-stop' : 'btn-state-start'}`;
                btn.textContent = isRunning ? 'STOP' : 'START';
            }
            if (badge) {
                badge.style.background = isRunning ? '#28a745' : '#6c757d';
                badge.textContent = isRunning ? 'RUNNING' : 'IDLE';
            }
            if (dot) {
                dot.className = `status-dot ${isRunning ? 'dot-running' : 'dot-idle'}`;
            }
        }

        async function startAll() {
            for (const inst of allInstances) {
                if (!instanceStates[inst.id].running) {
                    await toggleInstance(inst.id);
                }
            }
        }

        async function stopAll() {
            for (const inst of allInstances) {
                if (instanceStates[inst.id].running) {
                    await toggleInstance(inst.id);
                }
            }
        }

        async function clearLogs(id) {
            try {
                await fetch(`/instances/${id}/logs/clear`, { method: 'POST' });
                fetchLogs();
            } catch (err) {
                console.error(err);
            }
        }

        let lastLogContent = "";
        async function fetchLogs() {
            try {
                const res = await fetch(`/instances/${currentTab}/logs`);
                const data = await res.json();
                const terminal = document.getElementById('log_terminal');
                
                if (data.logs && data.logs.length > 0) {
                    const fullText = data.logs.join("");
                    if (fullText !== lastLogContent) {
                        lastLogContent = fullText;
                        terminal.textContent = fullText;
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                } else {
                    terminal.textContent = "No logs yet. Click START to begin.";
                }
            } catch (err) {
                // Ignore fetch errors during navigation
            }
        }

        // Poll logs every 900ms
        setInterval(fetchLogs, 900);
        fetchLogs();
    </script>
</body>
</html>
